name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            signingPlatform: win
            browserCommand: pnpm run verify:browser-runner
            desktopSmokeCommand: pnpm run verify:desktop-smoke
            downloadArtifactCommand: pnpm run verify:download-artifacts -- win
            platformSignatureCommand: pnpm run verify:platform-signatures -- win
            command: pnpm run dist:win
            artifact: LoopCAT-Windows
            uploadPath: |
              dist/*.exe
              dist/*.zip
              dist/SHA256SUMS.txt
          - name: macOS
            os: macos-latest
            signingPlatform: mac
            browserCommand: pnpm run verify:browser-runner
            desktopSmokeCommand: pnpm run verify:desktop-smoke
            downloadArtifactCommand: pnpm run verify:download-artifacts -- mac
            platformSignatureCommand: pnpm run verify:platform-signatures -- mac
            command: pnpm run dist:mac
            artifact: LoopCAT-macOS
            uploadPath: |
              dist/*.dmg
              dist/*.zip
              dist/SHA256SUMS.txt
          - name: Linux
            os: ubuntu-latest
            signingPlatform: linux
            browserCommand: xvfb-run -a pnpm run verify:browser-runner
            desktopSmokeCommand: xvfb-run -a pnpm run verify:desktop-smoke
            downloadArtifactCommand: pnpm run verify:download-artifacts -- linux
            platformSignatureCommand: pnpm run verify:platform-signatures -- linux
            command: pnpm run dist:linux
            artifact: LoopCAT-Linux
            uploadPath: |
              dist/*.AppImage
              dist/*.deb
              dist/SHA256SUMS.txt
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_KEYCHAIN: ${{ secrets.APPLE_KEYCHAIN }}
      APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify release provenance
        run: pnpm run verify:provenance -- --allow-untagged

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux packaging dependencies
        if: matrix.signingPlatform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ruby ruby-dev build-essential rpm libarchive-tools
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64
          sudo gem install --no-document fpm

      - name: Verify release contract
        run: pnpm run verify:release

      - name: Validate XLIFF 2.2 schema fixtures
        run: pnpm run verify:xliff22-schema

      - name: Self-test release provenance verifier
        run: pnpm run verify:provenance-selftest

      - name: Self-test release evidence verifier
        run: pnpm run verify:evidence-selftest

      - name: Self-test download artifact rules
        run: pnpm run verify:download-artifacts-selftest

      - name: Self-test platform signature artifact rules
        run: pnpm run verify:platform-signatures-selftest

      - name: Self-test signing environment verifier
        run: pnpm run verify:signing-env-selftest

      - name: Run static and focused quality gates
        run: pnpm run verify:quality

      - name: Run automated accessibility checks
        run: pnpm run verify:a11y

      - name: Run browser test suite
        run: ${{ matrix.browserCommand }}

      - name: Verify desktop wrapper
        run: pnpm run verify:desktop-wrapper

      - name: Verify signing environment
        run: pnpm run verify:signing-env -- ${{ matrix.signingPlatform }}

      - name: Build desktop artifact
        run: ${{ matrix.command }}

      - name: Smoke test packaged desktop app
        run: ${{ matrix.desktopSmokeCommand }}

      - name: Verify desktop artifact payload
        run: pnpm run verify:artifact

      - name: Verify Electron security fuses
        run: pnpm run verify:fuses

      - name: Verify downloadable artifacts
        run: ${{ matrix.downloadArtifactCommand }}

      - name: Verify platform signatures and notarization
        run: ${{ matrix.platformSignatureCommand }}

      - name: Generate checksums
        run: pnpm run checksums

      - name: Verify checksums
        run: pnpm run verify:checksums

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.uploadPath }}
          if-no-files-found: error

  web:
    name: Build static HTML
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify release provenance
        run: pnpm run verify:provenance -- --allow-untagged

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release contract
        run: pnpm run verify:release

      - name: Validate XLIFF 2.2 schema fixtures
        run: pnpm run verify:xliff22-schema

      - name: Build static HTML artifact
        run: pnpm run dist:web

      - name: Verify static HTML artifact
        run: pnpm run verify:web-artifact

      - name: Smoke test static HTML artifact
        run: pnpm run verify:web-smoke

      - name: Upload static HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: Static-Web-Bundle
          path: |
            dist-web/*.zip
            dist-web/SHA256SUMS.txt
          if-no-files-found: error

  release-bundle:
    name: Verify all-platform release bundle
    runs-on: ubuntu-latest
    needs: [build, web]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify release provenance
        run: pnpm run verify:provenance -- --allow-untagged

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: LoopCAT-*
          path: release-dist

      - name: Verify all-platform download bundle
        run: pnpm run verify:download-bundle -- --dist release-dist

      - name: Generate combined checksums
        run: node scripts/generate-checksums.cjs --dist release-dist

      - name: Verify combined checksums
        run: node scripts/verify-checksums.cjs --dist release-dist

      - name: Upload all-platform release bundle
        uses: actions/upload-artifact@v4
        with:
          name: LoopCAT-All-Platforms
          path: |
            release-dist/**/*.exe
            release-dist/**/*.dmg
            release-dist/**/*.zip
            release-dist/**/*.AppImage
            release-dist/**/*.deb
            release-dist/SHA256SUMS.txt
          if-no-files-found: error
