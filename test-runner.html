<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>LoopCAT Browser Test Runner</title>
    <link rel="icon" href="data:,">
    <style>
      body {
        margin: 20px;
        font-family: Arial, sans-serif;
        color: #202936;
        background: #f7f9fb;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }

      #summary {
        white-space: pre-wrap;
        border: 1px solid #d7dde5;
        border-radius: 6px;
        background: #fff;
        padding: 12px;
        min-height: 120px;
      }

      iframe {
        width: 100%;
        height: 180px;
        margin-top: 12px;
        border: 1px solid #d7dde5;
        border-radius: 6px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <h1>LoopCAT Browser Test Runner</h1>
    <pre id="summary">Running...</pre>
    <div id="frames"></div>
    <script>
      const tests = [
        { name: "Security policy", url: "./security-policy-test.html", pass: "SECURITY POLICY TEST PASS", fail: "SECURITY POLICY TEST FAIL" },
        { name: "Offline shell", url: "./offline-shell-test.html", pass: "OFFLINE SHELL TEST PASS", fail: "OFFLINE SHELL TEST FAIL" },
        { name: "Smoke", url: "./smoke-test.html", pass: "SMOKE TEST PASS", fail: "SMOKE TEST FAIL" },
        { name: "Regression", url: "./regression-test.html", pass: "REGRESSION TEST PASS", fail: "REGRESSION TEST FAIL" },
        { name: "App workflow", url: "./index.html#app-workflow-test", pass: "APP WORKFLOW TEST PASS", fail: "APP WORKFLOW TEST FAIL" },
        { name: "Workspace storage", url: "./workspace-storage-test.html", pass: "WORKSPACE STORAGE TEST PASS", fail: "WORKSPACE STORAGE TEST FAIL" },
        { name: "Package round trip", url: "./package-roundtrip-test.html", pass: "PACKAGE ROUNDTRIP TEST PASS", fail: "PACKAGE ROUNDTRIP TEST FAIL" },
        { name: "Large project", url: "./large-project-test.html", pass: "LARGE PROJECT TEST PASS", fail: "LARGE PROJECT TEST FAIL", timeout: 300000 }
      ];

      const summary = document.querySelector("#summary");
      const frames = document.querySelector("#frames");
      const lines = [];

      function update(line) {
        if (line) lines.push(line);
        summary.textContent = lines.join("\n") || "Running...";
        window.__loopcatBrowserRunnerStatus = summary.textContent;
        const current = line || lines.at(-1) || "Running";
        document.title = `LoopCAT Browser Test Runner - ${current}`;
      }

      function readFrameResult(frame) {
        try {
          return frame.contentDocument?.querySelector("#results")?.textContent ||
            frame.contentDocument?.querySelector("#appWorkflowTestResults")?.textContent ||
            "";
        } catch (error) {
          return `Could not read test frame: ${error.message}`;
        }
      }

      function runTest(test) {
        return new Promise((resolve) => {
          const frame = document.createElement("iframe");
          frame.title = `${test.name} test`;
          const startedAt = Date.now();
          let timer = null;
          let finished = false;
          const finish = (result) => {
            if (finished) return;
            finished = true;
            if (timer) clearInterval(timer);
            window.removeEventListener("message", onMessage);
            if (result.ok) frame.remove();
            else frame.dataset.failed = "true";
            resolve(result);
          };
          const onMessage = (event) => {
            if (event.source !== frame.contentWindow) return;
            if (event.data?.type !== "loopcat-test-result") return;
            const text = event.data.text || "";
            finish({ ok: text.includes(test.pass), text });
          };
          window.addEventListener("message", onMessage);
          frames.replaceChildren(frame);
          frame.src = test.url;
          timer = setInterval(() => {
            const text = readFrameResult(frame);
            if (text.includes(test.pass)) {
              finish({ ok: true, text });
            } else if (text.includes(test.fail)) {
              finish({ ok: false, text });
            } else if (Date.now() - startedAt > (test.timeout || 120000)) {
              finish({ ok: false, text: text || "Timed out waiting for test result." });
            }
          }, 250);
        });
      }

      (async () => {
        let failed = 0;
        for (const test of tests) {
          update(`RUN ${test.name}`);
          const result = await runTest(test);
          if (result.ok) {
            update(`PASS ${test.name}`);
          } else {
            failed += 1;
            update(`FAIL ${test.name}`);
            update(result.text);
            break;
          }
        }
        update(failed ? "TEST RUN FAILED" : "ALL TESTS PASS");
      })();
    </script>
  </body>
</html>
