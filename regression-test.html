        const assert = (condition, label) => {

        const encode = new TextEncoder();
        const writeUint16 = (bytes, offset, value) => {
          bytes[offset] = value & 0xff;
          bytes[offset + 1] = (value >>> 8) & 0xff;
        };
        const writeUint32 = (bytes, offset, value) => {
          bytes[offset] = value & 0xff;
          bytes[offset + 1] = (value >>> 8) & 0xff;
          bytes[offset + 2] = (value >>> 16) & 0xff;
          bytes[offset + 3] = (value >>> 24) & 0xff;
        };
        const concatBytes = (parts) => {
          const output = new Uint8Array(parts.reduce((sum, part) => sum + part.length, 0));
          let offset = 0;
          parts.forEach((part) => {
            output.set(part, offset);
            offset += part.length;
          });
          return output;
        };
        const crcTable = (() => {
          const table = new Uint32Array(256);
          for (let i = 0; i < 256; i += 1) {
            let value = i;
            for (let bit = 0; bit < 8; bit += 1) value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
            table[i] = value >>> 0;
          }
          return table;
        })();
        const crc32 = (bytes) => {
          let crc = 0xffffffff;
          for (let i = 0; i < bytes.length; i += 1) crc = crcTable[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
          return (crc ^ 0xffffffff) >>> 0;
        };
        const storedZip = (entries) => {
          const localParts = [];
          const centralParts = [];
          let offset = 0;
          Object.entries(entries).forEach(([name, value]) => {
            const nameBytes = encode.encode(name);
            const data = value instanceof Uint8Array ? value : encode.encode(String(value));
            const crc = crc32(data);
            const local = new Uint8Array(30 + nameBytes.length);
            writeUint32(local, 0, 0x04034b50);
            writeUint16(local, 4, 20);
            writeUint16(local, 8, 0);
            writeUint32(local, 14, crc);
            writeUint32(local, 18, data.length);
            writeUint32(local, 22, data.length);
            writeUint16(local, 26, nameBytes.length);
            local.set(nameBytes, 30);
            localParts.push(local, data);

            const central = new Uint8Array(46 + nameBytes.length);
            writeUint32(central, 0, 0x02014b50);
            writeUint16(central, 4, 20);
            writeUint16(central, 6, 20);
            writeUint16(central, 10, 0);
            writeUint32(central, 16, crc);
            writeUint32(central, 20, data.length);
            writeUint32(central, 24, data.length);
            writeUint16(central, 28, nameBytes.length);
            writeUint32(central, 42, offset);
            central.set(nameBytes, 46);
            centralParts.push(central);
            offset += local.length + data.length;
          });
          const centralDirectory = concatBytes(centralParts);
          const eocd = new Uint8Array(22);
          writeUint32(eocd, 0, 0x06054b50);
          writeUint16(eocd, 8, centralParts.length);
          writeUint16(eocd, 10, centralParts.length);
          writeUint32(eocd, 12, centralDirectory.length);
          writeUint32(eocd, 16, offset);
          return concatBytes([...localParts, centralDirectory, eocd]);
        };
        const zipEocdOffset = (bytes) => {
          for (let index = bytes.length - 22; index >= Math.max(0, bytes.length - 66000); index -= 1) {
            if (bytes[index] === 0x50 && bytes[index + 1] === 0x4b && bytes[index + 2] === 0x05 && bytes[index + 3] === 0x06) return index;
          }
          return -1;
        };
        const readZipUint32 = (bytes, offset) => (
          bytes[offset] |
          (bytes[offset + 1] << 8) |
          (bytes[offset + 2] << 16) |
          (bytes[offset + 3] << 24)
        ) >>> 0;
        const byteIndexOf = (bytes, needle) => {
          for (let index = 0; index <= bytes.length - needle.length; index += 1) {
            let matched = true;
            for (let offset = 0; offset < needle.length; offset += 1) {
              if (bytes[index + offset] !== needle[offset]) {
                matched = false;
                break;
              }
            }
            if (matched) return index;
          }
          return -1;

            draftAdaptationResult.suggestedTarget === "<0>{name}</0> ogesini acin." &&
            draftAdaptationResult.adaptMode === "shorten" &&
            draftAdaptationResult.protectedTokens.includes("{name}") &&
            draftAdaptationResult.warnings.length === 0,
          "AI command service builds draft adaptation prompts and returns reviewable target suggestions"
        );
        const stylePolishPrompt = window.CatHan.ai.buildStylePolishPrompt({
          sourceLanguage: "English",
          sourceCode: "en",
          targetLanguage: "Turkish",
          targetCode: "tr",
          sourceText: "Open <0>{name}</0>.",
          targetText: "<0>{name}</0> ogesini acin.",
          protectedTokens: ["<0>", "</0>", "{name}"],
          project: { aiSettings: { styleGuide: "Use concise UI wording." } },
          tmMatches: [{ source: "Open settings.", target: "Ayarlari acin.", score: 92 }],
          glossaryTerms: [{ sourceTerm: "Open", targetTerm: "Ac" }]
        });
        let stylePolishProviderRequest = null;
        const stylePolishResult = await window.CatHan.ai.aiCommandService.polishSegmentStyle({
          provider: {
            completePrompt: async (_config, request) => {
              stylePolishProviderRequest = request;
              return {
                text: "<0>{name}</0> ogesini ac.",
                provider: "Mock Polish AI",
                providerId: "mock-polish",
                model: "polish-model",
                prompt: request.prompt
              };
            }
          },
          project: { aiSettings: { styleGuide: "Use concise UI wording." } },
          segment: {
            id: "ai-polish-segment",
            source: "Open <0>{name}</0>.",
            target: "<0>{name}</0> ogesini acin.",
            tags: [{ text: "<0>" }, { text: "</0>" }]
          },
          settings: {
            providerId: "ollama",
            model: "polish-model",
            sourceLanguage: "English",
            sourceCode: "en",
            targetLanguage: "Turkish",
            targetCode: "tr"
          },
          protectedTokens: ["<0>", "</0>", "{name}"],
          tmMatches: [{ source: "Open settings.", target: "Ayarlari acin.", score: 92 }],
          glossaryTerms: [{ sourceTerm: "Open", targetTerm: "Ac" }]
        });
        assert(
          stylePolishPrompt.includes("Return only one improved target segment") &&
            stylePolishPrompt.includes("Project style instructions:") &&
            stylePolishPrompt.includes("Use concise UI wording.") &&
            stylePolishPrompt.includes("Translation memory hints:") &&
            stylePolishPrompt.includes("Project glossary hints:") &&
            stylePolishProviderRequest?.system.includes("style and terminology polishing assistant") &&
            stylePolishProviderRequest.prompt.includes("Current target Turkish draft:") &&
            stylePolishResult.suggestedTarget === "<0>{name}</0> ogesini ac." &&
            stylePolishResult.protectedTokens.includes("{name}") &&
            stylePolishResult.warnings.length === 0,
          "AI command service builds style polish prompts and returns reviewable target suggestions"
        );
        const termExtractionPrompt = window.CatHan.ai.buildTerminologyExtractionPrompt({
          sourceLanguage: "English",
          sourceCode: "en",
          targetLanguage: "Turkish",
          targetCode: "tr",
          sourceText: "Enable adaptive cache warming before deployment.",
          targetText: "Dagitimdan once uyarlanabilir onbellek isitmayi etkinlestirin."
        });
        let termExtractionProviderRequest = null;
        const termExtractionResult = await window.CatHan.ai.aiCommandService.extractSegmentTerms({
          provider: {
            completePrompt: async (_config, request) => {
              termExtractionProviderRequest = request;
              return {
                text: JSON.stringify([
                  { sourceTerm: "adaptive cache warming", targetTerm: "uyarlanabilir onbellek isitma", note: "Performance feature" },
                  { sourceTerm: "{name}", targetTerm: "{name}", note: "Placeholder must be ignored" },
                  { sourceTerm: "deployment", targetTerm: "dagitim", note: "Release process" }
                ]),
                provider: "Mock Terms AI",
                providerId: "mock-terms",
                model: "terms-model",
                prompt: request.prompt
              };
            }
          },
          project,
          segment: {
            id: "ai-terms-segment",
            source: "Enable adaptive cache warming before deployment.",
            target: "Dagitimdan once uyarlanabilir onbellek isitmayi etkinlestirin."
          },
          settings: {
            providerId: "ollama",
            model: "terms-model",
            sourceLanguage: "English",
            sourceCode: "en",
            targetLanguage: "Turkish",
            targetCode: "tr"
          }
        });
        assert(
          termExtractionPrompt.includes("Return only a JSON array") &&
            termExtractionPrompt.includes("sourceTerm, targetTerm, note") &&
            termExtractionPrompt.includes("Source English text:\nEnable adaptive cache warming before deployment.") &&
            termExtractionProviderRequest?.system.includes("terminology extraction assistant") &&
            termExtractionResult.terms.length === 2 &&
            termExtractionResult.terms[0].sourceTerm === "adaptive cache warming" &&
            termExtractionResult.terms.some((term) => term.targetTerm === "dagitim") &&
            !termExtractionResult.terms.some((term) => term.sourceTerm === "{name}"),
          "AI command service builds terminology extraction prompts and parses term candidates"
        );
        const projectBriefPrompt = window.CatHan.ai.buildProjectBriefPrompt({
          project: { ...project, domain: "Fintech onboarding" },
          sourceLanguage: "English",
          sourceCode: "en",
          targetLanguage: "Turkish",
          targetCode: "tr",
          documents: [{ name: "checkout.json" }],
          sampleSegments: [{ source: "Verify your payment method.", target: "Odeme yonteminizi dogrulayin." }],
          terms: [{ sourceTerm: "payment method", targetTerm: "odeme yontemi" }]
        });
        let projectBriefProviderRequest = null;
        const projectBriefResult = await window.CatHan.ai.aiCommandService.generateProjectBrief({
          provider: {
            completePrompt: async (_config, request) => {
              projectBriefProviderRequest = request;
              return {
                text: [
                  "Domain",
                  "- Fintech onboarding.",
                  "Audience",
                  "- End users completing payment setup.",
                  "Tone",
                  "- Clear and concise."
                ].join("\n"),
                provider: "Mock Brief AI",
                providerId: "mock-brief",
                model: "brief-model",
                prompt: request.prompt
              };
            }
          },
          project: { ...project, domain: "Fintech onboarding" },
          settings: {
            providerId: "ollama",
            model: "brief-model",
            sourceLanguage: "English",
            sourceCode: "en",
            targetLanguage: "Turkish",
            targetCode: "tr"
          },
          documents: [{ name: "checkout.json" }],
          sampleSegments: [{ source: "Verify your payment method.", target: "Odeme yonteminizi dogrulayin." }],
          terms: [{ sourceTerm: "payment method", targetTerm: "odeme yontemi" }]
        });
        assert(
          projectBriefPrompt.includes("Create a concise translation project brief") &&
            projectBriefPrompt.includes("Domain, Audience, Tone, Terminology, Formatting, Risks") &&
            projectBriefPrompt.includes("Documents:\n- checkout.json") &&
            projectBriefPrompt.includes("Existing termbase hints:\n- payment method -> odeme yontemi") &&
            projectBriefProviderRequest?.system.includes("project brief assistant") &&
            projectBriefResult.brief.includes("Fintech onboarding"),
          "AI command service builds project brief prompts and returns reusable project instructions"
        );
        const overwriteSelection = window.CatHan.ai.preTranslationService.selectSegments(pretranslationSegments, {
          settings: {
            overwriteExisting: true,
            preserveConfirmedLocked: false
          }
        });
        assert(
          !overwriteSelection.candidates.some((segment) => segment.id === "locked-local-ai" || segment.id === "confirmed-local-ai") &&
            overwriteSelection.candidates.some((segment) => segment.id === "existing-local-ai"),
          "Local AI pretranslation never selects locked or confirmed segments even when overwriting existing drafts"
        );

        const originalFetch = window.fetch;
        window.fetch = async () => ({
          ok: true,
          json: async () => ({ id: "regression-openai-response", output_text: "OpenAI regression target." })
        });
        try {
          const suggestion = await window.CatHan.ai.openAiSuggestion({
            apiKey: "sk-regression-local-stub",
            segment: reloaded[0],
            tmMatches: tmEntries.map((entry) => ({ ...entry, score: 100 })),
            terms: [],
            project: { ...project, aiSettings: { enabled: true, sendSourceToAi: true, provider: "OpenAI", model: "regression-test" } }
          });
          assert(suggestion.suggestedTarget === "OpenAI regression target." && suggestion.explanation.some((item) => item.includes("TM")), "OpenAI suggestion includes TM context explanation");
        } finally {
          window.fetch = originalFetch;
        }

        const resultText = `REGRESSION TEST PASS\n${out.join("\n")}`;
        document.querySelector("#results").textContent = resultText;
        window.parent?.postMessage({ type: "loopcat-test-result", name: "Regression", text: resultText }, "*");
      })().catch((error) => {
        const resultText = `REGRESSION TEST FAIL\n${error.stack || error.message}`;
        document.querySelector("#results").textContent = resultText;
        window.parent?.postMessage({ type: "loopcat-test-result", name: "Regression", text: resultText }, "*");
      });
    </script>
  </body>
</html>
